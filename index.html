<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website mua vợt Pickleball</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>WEBSITE MUA VỢT PICKLEBALL</h1>

        <section class="product-area" aria-label="Thông tin sản phẩm">

            <div
                id="image"
                class="image-box"
                onmouseover="update(productImage)"
                onmouseleave="undo()"
                onfocus="update(productImage)"
                onblur="undo()"
                tabindex="0"
                aria-label="Khu vực hiển thị hình ảnh sản phẩm"
            >

                <img
                    id="productImage"
                    src="votjoola.jpg"
                    alt="Vợt Joola Pickleball"
                >

                <span id="imageText">
                    Di chuột qua hoặc dùng phím Tab để xem hình ảnh.
                </span>

            </div>

            <div class="thumbnail-gallery">

                <img
                    src="votfranklin.png"
                    alt="Vợt Franklin Pickleball"
                    class="thumbnail"
                    onclick="selectImage(this)"
                    onmouseover="update(this)"
                    onmouseleave="undo()"
                    onfocus="update(this)"
                    onblur="undo()"
                >

                <img
                    src="votjoola.jpg"
                    alt="Vợt Joola Pickleball"
                    class="thumbnail"
                    onclick="selectImage(this)"
                    onmouseover="update(this)"
                    onmouseleave="undo()"
                    onfocus="update(this)"
                    onblur="undo()"
                >

                <img
                    src="votloco.webp"
                    alt="Vợt Loco Pickleball"
                    class="thumbnail"
                    onclick="selectImage(this)"
                    onmouseover="update(this)"
                    onmouseleave="undo()"
                    onfocus="update(this)"
                    onblur="undo()"
                >

                <img
                    src="votproton.jpg"
                    alt="Vợt Proton Pickleball"
                    class="thumbnail"
                    onclick="selectImage(this)"
                    onmouseover="update(this)"
                    onmouseleave="undo()"
                    onfocus="update(this)"
                    onblur="undo()"
                >

                <img
                    src="votrpm.webp"
                    alt="Vợt RPM Pickleball"
                    class="thumbnail"
                    onclick="selectImage(this)"
                    onmouseover="update(this)"
                    onmouseleave="undo()"
                    onfocus="update(this)"
                    onblur="undo()"
                >

                <img
                    src="votwika.jpg"
                    alt="Vợt Wika Pickleball"
                    class="thumbnail"
                    onclick="selectImage(this)"
                    onmouseover="update(this)"
                    onmouseleave="undo()"
                    onfocus="update(this)"
                    onblur="undo()"
                >

            </div>

            <h2 id="productName">Vợt Joola</h2>

            <p id="productPrice">Giá: 450.000 VNĐ</p>

            <div class="form-row">

                <label for="productSelect">
                    Chọn sản phẩm:
                </label>

                <select id="productSelect">

                    <option value="joola">
                        Vợt Joola
                    </option>

                    <option value="wika">
                        Vợt Wika
                    </option>

                    <option value="proton">
                        Vợt Proton
                    </option>

                </select>

            </div>

            <div class="form-row">

                <label for="quantity">
                    Số lượng:
                </label>

                <input
                    type="number"
                    id="quantity"
                    value="2"
                    min="1"
                    aria-label="Số lượng sản phẩm"
                >

            </div>

            <button id="calculateBtn" type="button">
                Tính tiền
            </button>

            <div class="result" aria-live="polite">

                <p>
                    Tiền hàng:
                    <span id="subtotal">0</span>
                    VNĐ
                </p>

                <p>
                    Giảm giá:
                    <span id="discount">0</span>
                    VNĐ
                </p>

                <p>
                    Phải trả:
                    <span id="total">0</span>
                    VNĐ
                </p>

            </div>

        </section>

        <hr>

        <section class="color-section">

            <h2>Đổi màu giao diện</h2>

            <div class="color-buttons">

                <button
                    type="button"
                    class="color-btn blue"
                    data-color="blue"
                >
                    Xanh
                </button>

                <button
                    type="button"
                    class="color-btn pink"
                    data-color="pink"
                >
                    Hồng
                </button>

                <button
                    type="button"
                    class="color-btn yellow"
                    data-color="yellow"
                >
                    Vàng
                </button>

            </div>

        </section>

        <hr>

        <section class="price-section">

            <h2>Bảng giá</h2>

            <button
                id="priceBtn"
                type="button"
            >
                Xem bảng giá
            </button>

            <div
                id="priceList"
                class="price-list"
                aria-live="polite"
            ></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
